<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Read-Only File Viewer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f4f9;
      margin: 0;
      padding: 20px;
    }
    iframe {
      width: 80%;
      height: 600px;
      border: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>Read the File</h1>
  <!-- File opens inside iframe -->
  <iframe src="Application Properties.pdf"></iframe>
  <p>You can read this file here.</p>
</body>
</html>
